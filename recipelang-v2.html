<header><h1>RecipeLang<br>Kitchen Compiler</h1>
<p>A recipe goes in as code. Eight stages check it, optimize it, run it in a virtual kitchen, and write a program and recipe card back out.</p></header>
<div class="line" id="line"></div>
<main>
<section class="pn" aria-label="Editor">
<div class="bar"><select id="ex" aria-label="Example"></select><label class="hint" style="margin:0" for="sv">Servings</label><input id="sv" type="number" min="1" placeholder="base"><select id="dt" aria-label="Diet"><option value="">Diet: none</option><option value="vegan">Diet: vegan</option><option value="vegetarian">Diet: vegetarian</option></select><span class="sp"></span><button class="run" id="run">Compile</button></div>
<div class="ed"><div class="gut" id="gut"></div><textarea id="src" spellcheck="false" aria-label="RecipeLang source"></textarea></div>
</section>
<section class="pn" aria-label="Results"><div class="tabs" id="tabs" role="tablist"></div><div class="view" id="view"></div></section>
</main>
<script>
const KW=new Set("RECIPE INGREDIENT STEP SERVES REPEAT DIET AVOID DEFINE END CALL".split(" "));
const UN=new Set("cups cup tbsp tsp g kg ml l pieces piece".split(" ")),TU=new Set("minutes minute seconds second hours hour".split(" "));
const RX=/(\d+)|(=)|(\()|(\))|(,)|(\n)|([ \t\r]+)|([A-Za-z_][A-Za-z0-9_]*)|(.)/gy,KD=[0,"NUMBER","ASSIGN","LPAREN","RPAREN","COMMA","NEWLINE","SKIP","IDENT","MISMATCH"];
class E extends Error{constructor(p,m,l){super(m);this.phase=p;this.line=l}}
const KB={rice:["",{cups:200}],oil:["",{tbsp:120}],tomato:["",{_:22}],onion:["",{_:40}],potato:["",{_:160}],salt:["",{tsp:0}],water:["",{ml:0,cups:0}],sugar:["",{tsp:16,tbsp:48}],lentils:["",{cups:230}],egg:["egg",{_:70}],butter:["dairy",{tbsp:100}],milk:["dairy",{cups:150,ml:.6}],paneer:["dairy",{g:3}],cheese:["dairy",{g:4}],chicken:["meat",{g:1.65}],fish:["fish",{g:1.2}],peanut:["nuts",{tbsp:95}],almond:["nuts",{tbsp:50}],flour:["gluten",{cups:455}],pasta:["gluten",{cups:220}],bread:["gluten",{_:80}],tofu:["",{g:1.45,_:90}],sesame:["",{tbsp:52}],soy_milk:["",{cups:100,ml:.4}],rice_flour:["",{cups:580}]};
const SUB={dairy:"oil",egg:"tofu",nuts:"sesame",meat:"tofu",fish:"tofu",gluten:"rice"};
function tokenize(s){const o=[];let ln=1,ls=0,m;RX.lastIndex=0;
 while(RX.lastIndex<s.length&&(m=RX.exec(s))){let k=KD[m.findIndex((x,i)=>i&&x!==undefined)],v=m[0];
  if(k==="NEWLINE"){ln++;ls=RX.lastIndex;continue}if(k==="SKIP")continue;
  if(k==="MISMATCH")throw new E("Lexical",`Unexpected character “${v}” at column ${m.index-ls+1}.`,ln);
  if(k==="IDENT")k=KW.has(v)?"KEYWORD":UN.has(v)?"UNIT":TU.has(v)?"TIMEUNIT":"IDENT";
  o.push({type:k,value:v,line:ln})}
 o.push({type:"EOF",value:"",line:ln});return o}
function parse(T){let p=0;const cur=()=>T[p],adv=()=>T[p++],sh=t=>t.type==="EOF"?"end of file":`${t.type} “${t.value}”`;
 const ex=(ty,v)=>{const t=cur();if(t.type!==ty||(v&&t.value!==v))throw new E("Syntax",`Expected ${v?`“${v}”`:ty} but found ${sh(t)}.`,t.line);return adv()};
 const kw=v=>cur().type==="KEYWORD"&&cur().value===v;
 const arg=()=>{const t=cur();if(t.type==="IDENT"){adv();return{kind:"ref",name:t.value}}
  if(t.type==="NUMBER"){adv();return{kind:"time",n:+t.value,unit:ex("TIMEUNIT").value}}
  throw new E("Syntax",`Invalid argument ${sh(t)}. Use a name or a time like 10 minutes.`,t.line)};
 const args=()=>{const a=[];ex("LPAREN");if(cur().type!=="RPAREN"){a.push(arg());while(cur().type==="COMMA"){adv();a.push(arg())}}ex("RPAREN");return a};
 const step=()=>{const k=ex("KEYWORD","STEP"),a=ex("IDENT");return{t:"step",action:a.value,args:args(),line:k.line}};
 const item=()=>{const t=cur();if(kw("STEP"))return step();
  if(kw("REPEAT")){adv();const n=+ex("NUMBER").value;return{t:"repeat",n,step:step(),line:t.line}}
  if(kw("CALL")){adv();const n=ex("IDENT");return{t:"call",name:n.value,args:args(),line:t.line}}
  throw new E("Syntax",`Expected STEP, REPEAT, CALL or DEFINE but found ${sh(t)}.`,t.line)};
 ex("KEYWORD","RECIPE");const r={name:ex("IDENT").value,serves:null,diet:null,avoid:[],ing:[],procs:[],items:[]};
 for(;;){if(kw("SERVES")){adv();r.serves=+ex("NUMBER").value}else if(kw("DIET")){adv();r.diet=ex("IDENT").value}
  else if(kw("AVOID")){adv();r.avoid.push(ex("IDENT").value);while(cur().type==="COMMA"){adv();r.avoid.push(ex("IDENT").value)}}else break}
 while(kw("INGREDIENT")){const k=adv(),n=ex("IDENT");ex("ASSIGN");const q=ex("NUMBER");let u=null;if(cur().type==="UNIT")u=adv().value;r.ing.push({name:n.value,qty:+q.value,unit:u,line:k.line})}
 if(!r.ing.length)throw new E("Syntax",`Recipe “${r.name}” needs at least one INGREDIENT before any STEP.`,cur().line);
 while(cur().type!=="EOF"){if(kw("DEFINE")){const d=adv(),n=ex("IDENT"),ps=[];ex("LPAREN");if(cur().type!=="RPAREN"){ps.push(ex("IDENT").value);while(cur().type==="COMMA"){adv();ps.push(ex("IDENT").value)}}ex("RPAREN");
   const body=[];while(!kw("END")){if(cur().type==="EOF")throw new E("Syntax",`DEFINE “${n.value}” is missing END.`,cur().line);body.push(item())}adv();r.procs.push({name:n.value,params:ps,body,line:d.line})}else r.items.push(item())}
 if(!r.items.length)throw new E("Syntax",`Recipe “${r.name}” needs at least one STEP.`,cur().line);return r}
function analyze(A){const er=[],tb=new Map(),push=(m,l,p="Semantic")=>er.push(new E(p,m,l));
 for(const i of A.ing){if(tb.has(i.name)){push(`Ingredient “${i.name}” is declared twice (first on line ${tb.get(i.name).line}).`,i.line);continue}
  if(i.qty<=0)push(`Quantity for “${i.name}” must be greater than zero.`,i.line);const kb=KB[i.name]||["",{}],kc=kb[1][i.unit||"_"];tb.set(i.name,{...i,type:"INGREDIENT",scope:A.name,tag:kb[0],kcal:(kc||0)*i.qty,na:kc===undefined})}
 const P=new Map();for(const d of A.procs){if(P.has(d.name))push(`Procedure “${d.name}” is defined twice.`,d.line);P.set(d.name,d);
  d.body.forEach(s=>(s.step||s).args.forEach(a=>{if(a.kind==="ref"&&!d.params.includes(a.name)&&!tb.has(a.name))push(`Procedure “${d.name}” uses “${a.name}”, which is neither a parameter nor a declared ingredient.`,s.line)}))}
 const out=[],sub=(a,e)=>a.kind==="ref"&&e[a.name]?e[a.name]:a,mk=(s,e,cl)=>out.push({action:s.action,args:s.args.map(a=>sub(a,e)),line:cl||s.line});
 const run=(its,e,stk,cl)=>{for(const s of its){if(s.t==="step")mk(s,e,cl);else if(s.t==="repeat")for(let i=0;i<s.n;i++)mk(s.step,e,cl);
  else{const d=P.get(s.name),l=cl||s.line;if(!d){push(`CALL to undefined procedure “${s.name}”.`,l);continue}
   if(stk.includes(s.name)){push(`Procedure “${s.name}” calls itself. Recursion is not allowed.`,l);continue}
   if(d.params.length!==s.args.length){push(`Procedure “${s.name}” expects ${d.params.length} argument(s) but CALL gives ${s.args.length}.`,l);continue}
   const e2={};d.params.forEach((p,i)=>e2[p]=sub(s.args[i],e));run(d.body,e2,[...stk,s.name],l)}}};
 run(A.items,{},[]);
 for(const s of out)for(const a of s.args){if(a.kind==="ref"&&!tb.has(a.name))push(`Ingredient “${a.name}” is used in STEP ${s.action} but never declared.`,s.line);if(a.kind==="time"&&a.n<=0)push(`Time value in STEP ${s.action} must be greater than zero.`,s.line)}
 if(A.diet&&!["vegan","vegetarian"].includes(A.diet))push(`DIET must be vegan or vegetarian, not “${A.diet}”.`,1);
 const ban=A.diet==="vegan"?["dairy","egg","fish","meat"]:A.diet==="vegetarian"?["fish","meat"]:[];
 for(const i of tb.values())if(i.tag){const why=A.avoid.includes(i.tag)?`AVOID ${i.tag}`:ban.includes(i.tag)?`DIET ${A.diet}`:null;
  if(why){const e=new E("Diet",`Ingredient “${i.name}” is tagged “${i.tag}”, which violates ${why}. Try replacing it with “${SUB[i.tag]}”.`,i.line);e.fix=[i.name,SUB[i.tag]];er.push(e)}}
 const seen=new Set();return{er:er.filter(e=>!seen.has(e.message)&&seen.add(e.message)).sort((a,b)=>a.line-b.line),tb,steps:out}}
const fq=(q,u)=>u?`${q} ${u}`:`${q}`,n2=x=>+x.toFixed(2),fa=a=>a.ingredient?`${a.ingredient}=${fq(a.qty,a.unit)}`:`${a.time} ${a.unit}`,fi=i=>`${i.action}(${i.args.map(fa).join(", ")})`;
function opt(ir){const o=[];let rm=0;for(const i of ir){const l=o[o.length-1];
 if(l&&i.action==="heat_pan"&&l.action==="heat_pan"){rm++;continue}
 if(l&&i.action==="cook"&&l.action==="cook"&&l.args[0]&&i.args[0]&&l.args[0].time&&i.args[0].time&&l.args[0].unit===i.args[0].unit){l.args=[{time:l.args[0].time+i.args[0].time,unit:l.args[0].unit}];rm++;continue}
 o.push({action:i.action,args:i.args})}return{ir:o,rm}}
function flow(ir){const s={pan:"COLD",c:[],cooked:false,served:false},sn=[],er=[],wn=[],us={};
 ir.forEach((i,k)=>{const n=k+1,A=i.action,rf=i.args.filter(a=>a.ingredient);
  if(s.served&&A!=="serve")er.push(`step ${n}: ${A}() happens after serve()`);
  if(A==="heat_pan")s.pan="HOT";
  else if(A==="cook"){if(s.pan==="COLD")er.push(`step ${n}: cook() on a cold pan`);else if(!s.c.length)er.push(`step ${n}: cook() on an empty pan`);s.cooked=true}
  else if(A==="serve"){if(!s.cooked)er.push(`step ${n}: serve() before the food was cooked`);s.served=true}
  else{if(A==="boil")s.pan="HOT";rf.forEach(r=>{if(A==="add"&&s.pan==="COLD")wn.push(`step ${n}: adding ${r.ingredient} to a cold pan (no heat_pan() before it)`);if(!s.c.includes(r.ingredient))s.c.push(r.ingredient)})}
  rf.forEach(r=>{const u=us[r.ingredient]=us[r.ingredient]||{qty:0,unit:r.unit};u.qty=n2(u.qty+r.qty)});
  sn.push({pan:s.pan,c:[...s.c],cooked:s.cooked,served:s.served,us:JSON.parse(JSON.stringify(us))})});return{er,wn,sn,us}}
const mins=ir=>Math.round(ir.reduce((t,i)=>t+i.args.reduce((x,a)=>x+(a.time?a.time*(/hour/.test(a.unit)?60:/second/.test(a.unit)?1/60:1):0),0),0));
const say=i=>{const w=i.action.replace(/_/g," ");return w[0].toUpperCase()+w.slice(1)+(i.args.length?" "+i.args.map(a=>a.ingredient?`${fq(a.qty,a.unit)} ${a.ingredient}`:`${a.time} ${a.unit}`).join(" and "):"")};
function genPy(R){const q=JSON.stringify;return[`print(${q("=== "+R.ast.name+" ===")})`,"print('Ingredients:')",...R.ingS.map(i=>`print(${q(" - "+fq(i.qty,i.unit)+" "+i.name)})`),"print('Method:')",...R.ir.map((i,k)=>`print(${q(` ${k+1}. ${say(i)}`)})`),`print('Total cooking time: ${mins(R.ir)} minute(s)')`].join("\n")}
function tree(n,pre="",last=true,root=true){let o=root?n[0]+"\n":pre+(last?"└── ":"├── ")+n[0]+"\n";const np=root?"":pre+(last?"    ":"│   ");n[1].forEach((k,i)=>o+=tree(k,np,i===n[1].length-1,false));return o}
const ax=x=>x.kind==="ref"?`Ref(${x.name})`:`Time(${x.n}, ${x.unit})`,sl=s=>s.t==="repeat"?`Repeat(${s.n}, Step(action=${s.step.action}, args=[${s.step.args.map(ax)}]))`:s.t==="call"?`Call(${s.name}, args=[${s.args.map(ax)}])`:`Step(action=${s.action}, args=[${s.args.map(ax)}])`;
const astTree=A=>tree([`Recipe(${A.name}${A.serves?`, serves=${A.serves}`:""}${A.diet?`, diet=${A.diet}`:""}${A.avoid.length?`, avoid=${A.avoid}`:""})`,[["IngredientList",A.ing.map(i=>[`Ingredient(name=${i.name}, qty=${i.qty}, unit=${i.unit})`,[]])],...(A.procs.length?[["ProcedureList",A.procs.map(d=>[`Define(${d.name}(${d.params}))`,d.body.map(s=>[sl(s),[]])])]]:[]),["StepList",A.items.map(s=>[sl(s),[]])]]]);

const EX={"TomatoRice (valid)":`RECIPE TomatoRice
INGREDIENT rice = 2 cups
INGREDIENT tomato = 3
INGREDIENT oil = 2 tbsp
STEP heat_pan()
STEP add(oil)
STEP add(tomato)
STEP add(rice)
STEP cook(10 minutes)
STEP serve()`,
"SpicyRice (procedures, REPEAT, SERVES)":`RECIPE SpicyRice
SERVES 4
DIET vegan
AVOID nuts
INGREDIENT rice = 2 cups
INGREDIENT cumin = 1 tsp
INGREDIENT oil = 1 tbsp
DEFINE tempering(spice)
STEP add(spice)
STEP stir()
END
DEFINE simmer(t)
STEP cook(t)
STEP stir()
END
STEP heat_pan()
STEP add(oil)
STEP add(rice)
REPEAT 3 STEP stir()
CALL tempering(cumin)
CALL simmer(15 minutes)
STEP serve()`,
"Vegan lentil soup":`RECIPE LentilSoup
SERVES 2
DIET vegan
INGREDIENT lentils = 1 cups
INGREDIENT onion = 2
INGREDIENT oil = 1 tbsp
INGREDIENT water = 500 ml
INGREDIENT salt = 1 tsp
STEP heat_pan()
STEP add(oil)
STEP add(onion)
STEP boil(water, lentils)
STEP add(salt)
STEP cook(25 minutes)
STEP serve()`,
"Vegetarian omelette":`RECIPE Omelette
DIET vegetarian
INGREDIENT egg = 3
INGREDIENT cheese = 30 g
INGREDIENT butter = 1 tbsp
INGREDIENT salt = 1 tsp
STEP heat_pan()
STEP add(butter)

const uk=u=>u==null?"None":u;
function lev(a,b){const d=[];for(let i=0;i<=a.length;i++){d[i]=[i];}for(let j=1;j<=b.length;j++)d[0][j]=j;
 for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]==b[j-1]?0:1));return d[a.length][b.length];}
const sim=(a,b)=>1-lev(a,b)/Math.max(a.length,b.length);
const close=(w,list,c)=>{let b=null,s=c;list.forEach(x=>{const v=sim(w,x);if(v>=s){s=v;b=x;}});return b;};
const med=a=>{a=[...a].sort((x,y)=>x-y);const m=a.length>>1;return a.length?(a.length%2?a[m]:(a[m-1]+a[m])/2):null;};

/* ---------- parse / unparse ---------- */
function parse(src){
 const r={name:"",serves:null,diet:null,avoid:[],protect:[],contracts:[],ings:[],steps:[],errors:[]};
 src.split("\n").forEach((raw,i)=>{const t=raw.trim();if(!t)return;let m;
  if(m=t.match(/^RECIPE\s+(\w+)$/))r.name=m[1];
  else if(m=t.match(/^SERVES\s+(-?\d+)$/))r.serves=+m[1];
  else if(m=t.match(/^DIET\s+(\w+)$/))r.diet=m[1];
  else if(m=t.match(/^AVOID\s+(\w+)$/))r.avoid.push(m[1]);
  else if(m=t.match(/^PROTECT\s+(\w+)$/))r.protect.push(m[1]);
  else if(m=t.match(/^ENSURE\s+(\w+)\s*(<=|>=|==|<|>)\s*(\d+)\s*(\w+)?$/))r.contracts.push({metric:m[1],op:m[2],value:+m[3],unit:m[4]||null});
  else if(m=t.match(/^INGREDIENT\s+(\w+)\s*=\s*(-?\d+)\s*(\w+)?$/))r.ings.push({name:m[1],q:+m[2],unit:m[3]||null});
  else if(m=t.match(/^(?:REPEAT\s+(-?\d+)\s+)?STEP\s+(\w+)\((.*)\)$/)){
   const args=m[3].trim()?m[3].split(",").map(a=>{a=a.trim();const x=a.match(/^(-?\d+)\s*(\w+)$/);return x&&TS[x[2]]?{t:1,v:+x[1],u:x[2]}:{t:0,n:a};}):[];
   r.steps.push({a:m[2],args,rep:m[1]===undefined?1:+m[1]});}
  else r.errors.push(`line ${i+1}: cannot parse “${t}”`);});
 return r;}
function unparse(r){const L=["RECIPE "+r.name];if(r.serves)L.push("SERVES "+r.serves);if(r.diet)L.push("DIET "+r.diet);
 r.avoid.forEach(a=>L.push("AVOID "+a));r.protect.forEach(p=>L.push("PROTECT "+p));
 r.contracts.forEach(c=>L.push(`ENSURE ${c.metric} ${c.op} ${c.value}${c.unit?" "+c.unit:""}`));
 r.ings.forEach(i=>L.push(`INGREDIENT ${i.name} = ${i.q}${i.unit?" "+i.unit:""}`));L.push("");
 r.steps.forEach(s=>L.push(`${s.rep!=1?"REPEAT "+s.rep+" ":""}STEP ${s.a}(${s.args.map(a=>a.t?a.v+" "+a.u:a.n).join(", ")})`));return L.join("\n")+"\n";}

/* ---------- 1. auto-fix ---------- */
function fixSource(src,log){
 return src.split("\n").map((line,i)=>{const n=i+1;
  const bad=line.match(/[^A-Za-z0-9_=(),<>\s]/g);if(bad){log.push(`line ${n}: removed illegal character ${[...new Set(bad)].join(" ")}`);line=line.replace(/[^A-Za-z0-9_=(),<>\s]/g,"");}
  let m=line.match(/^(\s*)([A-Za-z_]+)(.*)$/);
  if(m&&!KW.includes(m[2])){let f=null;if(KW.includes(m[2].toUpperCase())&&m[2]!==m[2].toUpperCase())f=m[2].toUpperCase();
   else if(m[2]===m[2].toUpperCase())f=close(m[2],KW,.7);
   if(f){log.push(`line ${n}: keyword “${m[2]}” → ${f}`);line=m[1]+f+m[3];}}
  m=line.match(/\bSTEP\s+([A-Za-z_]\w*)/);if(m&&!ACTS.includes(m[1])){const c=close(m[1],ACTS,.8);if(c){log.push(`line ${n}: action “${m[1]}” → ${c}`);line=line.replace(m[1],c);}}
  if(/^\s*(REPEAT\s+\d+\s+)?STEP\s+\w+\s*$/.test(line)){log.push(`line ${n}: added missing ()`);line=line.trimEnd()+"()";}
  m=line.match(/^(\s*INGREDIENT\s+\w+)\s+(\d+.*)$/);if(m){log.push(`line ${n}: added missing =`);line=m[1]+" = "+m[2];}
  return line;}).join("\n");}
function expectedCook(names,ex){const a=new Set(names);const sc=D.CORPUS.map(r=>{const b=new Set(r.i);let x=0;a.forEach(v=>b.has(v)&&x++);return[x/(a.size+b.size-x),r.c];}).filter(s=>s[0]>=.25&&s[0]<1).sort((p,q)=>q[0]-p[0]).slice(0,5);
 return sc.length?{e:med(sc.map(s=>s[1])),n:sc.length,tol:Math.max(3,med(sc.map(s=>s[1]))*.9/Math.sqrt(sc.length))}:null;}
function typQty(n,u){const v=D.CORPUS.filter(r=>r.q[n]&&r.q[n][1]===u).map(r=>r.q[n][0]);return v.length?Math.round(med(v)):null;}
function fixMeaning(r,log){
 if(r.serves!==null&&r.serves<=0){log.push("SERVES invalid → removed");r.serves=null;}
 const seen={},keep=[];r.ings.forEach(i=>{if(seen[i.name]){const f=seen[i.name];if(f.unit===i.unit&&f.q>0&&i.q>0){f.q+=i.q;log.push(`duplicate “${i.name}” merged (now ${f.q})`);}else log.push(`duplicate “${i.name}” dropped`);}else{seen[i.name]=i;keep.push(i);}});r.ings=keep;
 r.ings.forEach(i=>{if(i.q<=0){const t=typQty(i.name,i.unit)||1;log.push(`quantity of “${i.name}” was ${i.q} → ${t} (${typQty(i.name,i.unit)?"learned":"default"})`);i.q=t;}});
 const dec=()=>r.ings.map(i=>i.name);
 for(let s=0;s<r.steps.length;s++){const st=r.steps[s];if(st.rep<=0){log.push("REPEAT ≤ 0 → 1");st.rep=1;}
  for(let j=0;j<st.args.length;j++){const a=st.args[j];
   if(a.t&&a.v<=0){const x=expectedCook(dec());const v=x?Math.round(x.e):10;log.push(`time ${a.v} ${a.u} → ${v} minutes (${x?"learned from "+x.n+" similar recipes":"default"})`);a.v=v;a.u="minutes";}
   else if(!a.t&&!dec().includes(a.n)){const c=close(a.n,dec(),.72);
    if(c){log.push(`“${a.n}” not declared → renamed to “${c}”`);a.n=c;}
    else if(D.KB[a.n]){const u=Object.keys(D.KB[a.n].k)[0];const un=u==="None"?null:u;const q=typQty(a.n,un)||1;r.ings.push({name:a.n,q,unit:un});log.push(`“${a.n}” not declared → declared from knowledge base (${q}${un?" "+un:""})`);}
    else{log.push(`“${a.n}” not declared → removed from step`);st.args.splice(j--,1);}}}}
 r.steps=r.steps.filter(s=>!(s.a==="add"&&!s.args.length));}
function flatActs(s){return Array(Math.max(s.rep,1)).fill([s.a,s.args.filter(a=>!a.t).map(a=>a.n)]);}
function fixFlow(r,log){
 for(let it=0;it<14;it++){let issue=null,hot=false,cont=new Set,cooked=false,served=false;
  outer:for(let i=0;i<r.steps.length;i++)for(const[act,ns]of flatActs(r.steps[i])){
   if(served&&act!=="serve"){issue=["after",i];break outer;}
   if(act==="heat_pan"||act==="boil"){hot=true;ns.forEach(n=>cont.add(n));}
   else if(act==="add"){if(!hot){issue=["cold",i];break outer;}ns.forEach(n=>cont.add(n));}
   else if(act==="cook"){if(!hot){issue=["cold",i];break outer;}if(!cont.size){issue=["empty",i];break outer;}cooked=true;}
   else if(act==="serve"){if(!cooked){issue=["early",i];break outer;}served=true;}}
  if(!issue)break;const[k,i]=issue;
  if(k==="cold"){r.steps.splice(i,0,{a:"heat_pan",args:[],rep:1});log.push(`step ${i+1} needs heat → inserted heat_pan()`);}
  else if(k==="empty"){const used=new Set(r.steps.flatMap(s=>s.args.filter(a=>!a.t).map(a=>a.n)));const un=r.ings.map(x=>x.name).filter(n=>!used.has(n));
   if(!un.length){log.push("UNFIXED: cook() with an empty pan and no spare ingredient");return false;}
   r.steps.splice(i,0,{a:"add",args:un.map(n=>({t:0,n})),rep:1});log.push(`empty pan → inserted add(${un.join(", ")})`);}
  else if(k==="early"){if(r.steps.slice(i+1).some(s=>s.a==="cook")){r.steps.push(r.steps.splice(i,1)[0]);log.push("serve() came too early → moved to the end");}
   else{const x=expectedCook(r.ings.map(z=>z.name));const t=x?Math.round(x.e):10;r.steps.splice(i,0,{a:"cook",args:[{t:1,v:t,u:"minutes"}],rep:1});log.push(`no cooking before serve → inserted cook(${t} minutes)`);}}
  else{const s=r.steps.findIndex(z=>z.a==="serve");r.steps.push(r.steps.splice(s,1)[0]);log.push("steps after serve() → serve() moved to the end");}}
 if(!r.steps.some(s=>s.a==="serve")){r.steps.push({a:"serve",args:[],rep:1});log.push("recipe never served → appended serve()");}return true;}

/* ---------- metrics ---------- */
const kc=(n,q,u,w)=>{const e=D.KB[n];if(!e)return 0;const v=e[w][uk(u)];return v==null?null:v*q;};
function uses(r){const m={};r.steps.forEach(s=>s.args.forEach(a=>{if(!a.t)m[a.n]=(m[a.n]||0)+s.rep;}));return m;}
function measure(r){const u=uses(r);let k=0,p=0;r.ings.forEach(i=>{const n=u[i.name]||0;k+=n*(kc(i.name,i.q,i.unit,"k")||0);p+=n*(kc(i.name,i.q,i.unit,"p")||0);});
 let sec=0;r.steps.forEach(s=>s.args.forEach(a=>{if(a.t)sec+=a.v*TS[a.u]*s.rep;}));const sv=r.serves||null;
 return{calories:k,calories_per_serving:sv?k/sv:null,protein:p,protein_per_serving:sv?p/sv:null,cook_time:sec/60};}
const bound=c=>c.metric==="cook_time"?c.value*(TS[c.unit]||60)/60:c.value;
const holds=(v,op,b)=>op==="<="?v<=b+1e-9:op===">="?v>=b-1e-9:op==="<"?v<b-1e-9:op===">"?v>b+1e-9:Math.abs(v-b)<=.5;
const fv=(m,v)=>v==null?"n/a":m==="cook_time"?v.toFixed(1)+" min":v.toFixed(1)+(m.startsWith("cal")?" kcal":" g");
function verify(r,m){return r.contracts.map(c=>{const a=m[c.metric];return{c,a,b:bound(c),ok:a!=null&&holds(a,c.op,bound(c))};});}
function blame(r,c){const u=uses(r),parts={};
 if(c.metric==="cook_time"){r.steps.forEach((s,i)=>s.args.forEach(a=>{if(a.t)parts[`step ${i+1}: ${s.a}()`]=(parts[`step ${i+1}: ${s.a}()`]||0)+a.v*TS[a.u]*s.rep/60;}));}
 else{const w=c.metric.startsWith("cal")?"k":"p",d=c.metric.endsWith("serving")?r.serves:1;r.ings.forEach(i=>{const v=(u[i.name]||0)*(kc(i.name,i.q,i.unit,w)||0)/d;if(v)parts[i.name]=v;});}
 const t=Object.values(parts).reduce((a,b)=>a+b,0)||1;return Object.entries(parts).sort((a,b)=>b[1]-a[1]).slice(0,4).map(([k,v])=>[k,v,100*v/t]);}

/* ---------- 2. contracts: uniform-cost auto-tuner ---------- */
class Heap{constructor(){this.a=[];}push(x){const a=this.a;a.push(x);let i=a.length-1;while(i){const p=(i-1)>>1;if(a[p][0]<=a[i][0])break;[a[p],a[i]]=[a[i],a[p]];i=p;}}
 pop(){const a=this.a,t=a[0],l=a.pop();if(a.length){a[0]=l;let i=0;for(;;){let c=2*i+1;if(c>=a.length)break;if(c+1<a.length&&a[c+1][0]<a[c][0])c++;if(a[i][0]<=a[c][0])break;[a[i],a[c]]=[a[c],a[i]];i=c;}}return t;}get size(){return this.a.length;}}
const rng=(v,l)=>{const lo=Math.max(1,Math.ceil(v*(1-l))),hi=Math.max(v,Math.floor(v*(1+l))),o=[];for(let x=lo;x<=hi;x++)o.push(x);return o;};
function tune(r,limit){
 const u=uses(r),declared=new Set(r.ings.map(i=>i.name)),dims=[];
 const NV=["chicken","fish"],DA=["paneer","cheese","milk","butter","egg"];
 r.ings.forEach((ing,idx)=>{if(r.protect.includes(ing.name)||!u[ing.name])return;
  dims.push({k:"q",idx,base:ing.q,vals:rng(ing.q,limit),name:ing.name});
  const alts=(D.ALTS[ing.name]||[]).filter(a=>!declared.has(a)&&D.KB[a]&&D.KB[a].k[uk(ing.unit)]!=null&&D.KB[a].p[uk(ing.unit)]!=null&&!(r.diet&&NV.includes(a))&&!(r.diet==="vegan"&&DA.includes(a)));
  if(alts.length)dims.push({k:"s",idx,base:0,vals:[ing.name,...alts],name:ing.name});});
 const tdims=[];r.steps.forEach((s,si)=>s.args.forEach((a,ai)=>{if(a.t&&a.v>0)dims.push({k:"t",si,ai,base:a.v,vals:rng(a.v,limit),mult:TS[a.u]*s.rep/60,name:s.a+"() time"});}));
 const base0=measure(r);
 const model=st=>{let k=0,p=0,cook=base0.cook_time;const q={},sw={};
  dims.forEach((d,i)=>{if(d.k==="q")q[d.idx]=d.vals[st[i]];else if(d.k==="s")sw[d.idx]=d.vals[st[i]];else cook+=(d.vals[st[i]]-d.base)*d.mult;});
  r.ings.forEach((ing,i)=>{const n=u[ing.name]||0,nm=sw[i]||ing.name,qq=q[i]!==undefined?q[i]:ing.q;k+=n*(kc(nm,qq,ing.unit,"k")||0);p+=n*(kc(nm,qq,ing.unit,"p")||0);});
  const s=r.serves;return{calories:k,calories_per_serving:s?k/s:null,protein:p,protein_per_serving:s?p/s:null,cook_time:cook};};
 const viol=st=>{const m=model(st);return r.contracts.reduce((t,c)=>{const v=m[c.metric],b=bound(c);return t+(holds(v,c.op,b)?0:Math.abs(v-b)/Math.max(b,1)+1e-6);},0);};
 const cost=st=>dims.reduce((t,d,i)=>t+(d.k==="s"?(st[i]?1:0):Math.abs(d.vals[st[i]]-d.base)/d.base),0);
 const start=dims.map(d=>d.k==="s"?0:d.vals.indexOf(d.base)),key=s=>s.join(",");
 const H=new Heap,seen=new Set([key(start)]);H.push([0,start]);let ex=0,best=[viol(start),start];
 while(H.size){const[c,st]=H.pop();ex++;const v=viol(st);
  if(v===0){const n=JSON.parse(JSON.stringify(r));dims.forEach((d,i)=>{const x=d.vals[st[i]];
    if(d.k==="q")n.ings[d.idx].q=x;else if(d.k==="t")n.steps[d.si].args[d.ai].v=x;});
   dims.forEach((d,i)=>{if(d.k==="s"&&st[i]){const o=d.name,nw=d.vals[st[i]];n.ings[d.idx].name=nw;n.steps.forEach(s=>s.args.forEach(a=>{if(!a.t&&a.n===o)a.n=nw;}));}});
   return{ok:1,n,c,ex,edits:edits(dims,st)};}
  if(v<best[0])best=[v,st];if(ex>=200000)return{ok:0,ex,budget:1};
  dims.forEach((d,i)=>{const nb=[];if(d.k==="s"){if(st[i]===0)for(let o=1;o<d.vals.length;o++)nb.push(o);}
   else{const b=d.vals.indexOf(d.base);if(st[i]>=b&&st[i]+1<d.vals.length)nb.push(st[i]+1);if(st[i]<=b&&st[i]>0)nb.push(st[i]-1);}
   nb.forEach(o=>{const n=st.slice();n[i]=o;const k=key(n);if(!seen.has(k)){seen.add(k);H.push([cost(n),n]);}});});}
 return{ok:0,ex,close:edits(dims,best[1])};}
function edits(dims,st){const o=[];dims.forEach((d,i)=>{if(d.k==="s"){if(st[i])o.push(`swap “${d.name}” for “${d.vals[st[i]]}”`);}
 else if(d.vals[st[i]]!==d.base)o.push(`${d.name}${d.k==="q"?" quantity":""}: ${d.base} → ${d.vals[st[i]]} (${Math.round(100*(d.vals[st[i]]-d.base)/d.base)>0?"+":""}${Math.round(100*(d.vals[st[i]]-d.base)/d.base)}%)`);});return o;}

/* ---------- 3. reasoning + learning ---------- */
function reason(r,m){const names=r.ings.map(i=>i.name),has=n=>names.includes(n),L=[];
 const cooked=r.steps.some(s=>s.a==="cook");
 const cat=has("rice")&&cooked?"rice dish":has("lentils")&&cooked?"lentil dish (dal / soup)":has("egg")?"egg dish":has("chicken")&&cooked?"chicken dish":has("potato")&&cooked?"potato dish":null;
 if(cat){L.push([`category = ${cat}`,"a main ingredient is present and a cook() step exists"]);
  if(!has("salt"))L.push(["suggest: add salt","savoury dishes are normally salted"]);}
 const under=Object.entries(D.MIN).filter(([n,v])=>has(n)&&cooked&&m.cook_time<v);
 return{L,under};}
function raiseTime(r,need){const tot=measure(r).cook_time;for(let i=r.steps.length-1;i>=0;i--)for(const a of r.steps[i].args)if(a.t){a.v=Math.ceil(a.v*TS[a.u]/60+(need-tot));a.u="minutes";return true;}return false;}


let pending="";
const sec=(t,items,w)=>`<div class="sec${w?" w":""}"><h3>${t}</h3>${items.length?"<ul>"+items.map(i=>"<li>"+i+"</li>").join("")+"</ul>":"<span class=mute>nothing to report</span>"}</div>`;
function contractsHtml(r,m){return`<table><tr><th>Contract</th><th>Actual</th><th>Verdict</th></tr>`+verify(r,m).map(v=>`<tr><td>${esc(v.c.metric+" "+v.c.op+" "+v.c.value+(v.c.unit?" "+v.c.unit:""))}</td><td>${fv(v.c.metric,v.a)}</td><td><span class="pill ${v.ok?"pass":"fail"}">${v.ok?"PASS":"FAIL"}</span></td></tr>`).join("")+"</table>";}
function goalsReport(r,html){
 if(!r.contracts.length){html.push(sec("Goals (ENSURE)",["No ENSURE lines in this recipe."]));return r;}
 const m=measure(r);const vs=verify(r,m);html.push(`<div class="sec"><h3>Contract verification</h3>${contractsHtml(r,m)}</div>`);
 const bad=vs.filter(v=>!v.ok);if(!bad.length){html.push(sec("Result",["All contracts are proven for this recipe."]));return r;}
 html.push(sec("Blame attribution",bad.map(v=>`<b>${esc(v.c.metric)}</b> (${fv(v.c.metric,v.a)}): `+blame(r,v.c).map(b=>`${esc(b[0])} ${b[2].toFixed(0)}%`).join(", ")),1));
 const t=tune(r,.5);
 if(t.ok){const m2=measure(t.n);html.push(sec(`Auto-tuner: cheapest fix (explored ${t.ex} candidates, cost ${t.c.toFixed(2)})`,t.edits));
  html.push(`<div class="sec"><h3>Re-verification</h3>${contractsHtml(t.n,m2)}</div>`);return t.n;}
 html.push(sec("Auto-tuner",[t.budget?"Search budget exhausted; try looser goals.":`Explored all ${t.ex} reachable recipes: no allowed edit meets every goal.`,...(t.close&&t.close.length?["Closest attempt: "+t.close.join("; ")]:[])],1));return r;}
function smart(src){
 const html=[],log=[];let text=fixSource(src,log);let r=parse(text);
 if(r.errors.length){html.push(sec("Auto-fix: parse problems remain",r.errors.map(esc),1));return{html,r:null};}
 fixMeaning(r,log);const ok=fixFlow(r,log);
 html.push(sec(`1. Auto error detection and fixing (${log.length} fix${log.length==1?"":"es"})`,log.map(esc),!ok));
 if(!r.name||!r.steps.length){html.push(sec("Cannot continue",["Recipe has no name or steps."],1));return{html,r:null};}
 let m=measure(r),rs=reason(r,m);
 const dec=[];if(rs.under.length){const need=Math.max(...rs.under.map(x=>x[1]));if(raiseTime(r,need)){dec.push(`<b>Decision:</b> ${rs.under.map(x=>x[0]).join(", ")} needs at least ${need} min but cooks ${m.cook_time.toFixed(0)} min → cooking time raised`);m=measure(r);rs=reason(r,m);}}
 html.push(sec("2. Reasoning",[...dec,...rs.L.map(x=>`${esc(x[0])} <span class="mute">because ${esc(x[1])}</span>`)]));
 const names=r.ings.map(i=>i.name),ex=expectedCook(names),lr=[];
 if(ex){const d=Math.abs(m.cook_time-ex.e)<=ex.tol?"typical":m.cook_time>ex.e?"much longer than usual":"much shorter than usual";lr.push(`cooking time ${m.cook_time.toFixed(0)} min vs expected ${ex.e.toFixed(0)} ± ${ex.tol.toFixed(0)} min (${ex.n} similar recipes) → <b>${d}</b>`);}
 const cnt={};D.CORPUS.forEach(c=>c.i.forEach(i=>cnt[i]=(cnt[i]||0)+1));const sug={};
 names.forEach(x=>{const w=D.CORPUS.filter(c=>c.i.includes(x));if(w.length<3)return;const co={};w.forEach(c=>c.i.forEach(y=>co[y]=(co[y]||0)+1));
  Object.entries(co).forEach(([y,n])=>{if(!names.includes(y)&&n>=3&&n/w.length>=.7&&(!sug[y]||sug[y][0]<n/w.length))sug[y]=[n/w.length,x,w.length];});});
 Object.entries(sug).sort((a,b)=>b[1][0]-a[1][0]).slice(0,3).forEach(([y,v])=>lr.push(`suggestion: add “${y}”? ${Math.round(v[0]*100)}% of ${v[2]} remembered recipes with “${v[1]}” use it`));
